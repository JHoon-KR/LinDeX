# LinDeX Neofetch adapter for Android ARM64 hardware identity.

# Passing --config makes Neofetch skip its normal per-user config lookup. Load
# that config here unless the caller supplied an explicit --config argument.
if [[ ${LINDEX_NEOFETCH_EXPLICIT_CONFIG:-0} != 1 ]]; then
    if [[ -f ${XDG_CONFIG_HOME}/neofetch/config.conf ]]; then
        source "${XDG_CONFIG_HOME}/neofetch/config.conf"
    elif [[ -f ${XDG_CONFIG_HOME}/neofetch/config ]]; then
        source "${XDG_CONFIG_HOME}/neofetch/config"
    fi
fi

# Users who deliberately provide their own detector can opt out without
# bypassing the wrapper or changing the pinned upstream Neofetch file.
if [[ ${LINDEX_NEOFETCH_HARDWARE:-1} == 1 ]]; then
    _lindex_hardware_info=${LINDEX_HARDWARE_INFO_BIN:-/usr/local/libexec/android-drm/lindex-hardware-info}

    get_cpu() {
        local cores speed

        cpu="$("$_lindex_hardware_info" cpu 2>/dev/null)"
        [[ $cpu ]] || cpu=ARM64
        [[ $cpu_brand == off ]] && cpu="${cpu#Qualcomm }"

        if [[ $cpu_cores != off ]]; then
            cores="$("$_lindex_hardware_info" cpu-cores 2>/dev/null)"
            cores="${cores//[[:space:]]}"
            [[ $cores ]] && cpu="$cpu ($cores)"
        fi

        if [[ $cpu_speed != off ]]; then
            speed="$("$_lindex_hardware_info" cpu-max-khz 2>/dev/null)"
            speed="${speed//[[:space:]]}"
            if [[ $speed =~ ^[0-9]+$ ]] && ((speed > 0)); then
                speed=$((speed / 1000))
                if ((speed < 1000)); then
                    cpu="$cpu @ ${speed}MHz"
                else
                    [[ $speed_shorthand == on ]] && speed=$((speed / 100))
                    speed="${speed:0:1}.${speed:1}"
                    cpu="$cpu @ ${speed}GHz"
                fi
            fi
        fi
    }

    get_gpu() {
        local gpu

        gpu="$("$_lindex_hardware_info" gpu 2>/dev/null)"
        [[ $gpu ]] || return
        [[ $gpu_brand == off ]] && gpu="${gpu#Qualcomm }"
        prin "${subtitle:+${subtitle}${gpu_name}}" "$gpu"
    }
fi
